name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, types, build, schema drift
    runs-on: ubuntu-latest
    services:
      # Shadow-БД для проверки дрейфа миграций (prisma migrate diff).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillet_ci
      # DATABASE_URL обязателен для prisma validate/generate/build (в CI нет .env);
      # реальных подключений нет: migrate diff работает только через shadow-БД.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillet_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migration drift (migrations == schema.prisma)
        run: |
          # exit-code 2 = найдены различия — падаем до мержа.
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillet_test
      AUTH_SECRET: ci-test-secret
      # Для prisma generate (env-переменная схемы); подключения идут только
      # к TEST_DATABASE_URL через globalSetup тестов.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillet_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # globalSetup тестов сам выполняет prisma migrate deploy на TEST_DATABASE_URL.
      - name: Run tests (unit + integration)
        run: npx vitest run