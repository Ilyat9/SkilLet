version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillet-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skillet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Отдельный one-off сервис для миграций и сидирования БД.
  # Выполняется в образе builder-стадии (с полными node_modules и prisma CLI),
  # поэтому продовый runner остаётся минимальным.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: skillet-migrate
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/skillet
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillet-app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/skillet
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: node server.js

volumes:
  postgres_data:
